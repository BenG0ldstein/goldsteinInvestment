<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Goldstein Investment — Private Wealth & Digital Assets</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5.0.14/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.16/index.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
  :root{
    --midnight:#0B1426;
    --deep:#101D32;
    --charcoal:#17191D;
    --gold:#C6A66B;
    --gold-dim:#A88A52;
    --gold-soft:#D9BE87;
    --ivory:#F6F2EA;
    --cream:#EEE8DC;
    --line:rgba(198,166,107,0.18);
    --line-soft:rgba(246,242,234,0.08);
    --muted:#8a93a6;
    --green:#5bb98c;
    --red:#d97474;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',sans-serif;
    background:var(--midnight);
    color:var(--ivory);
    -webkit-font-smoothing:antialiased;
    font-size:14px;
    line-height:1.55;
  }
  h1,h2,h3,h4,.serif{font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:.2px}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:14px}
  ::selection{background:var(--gold);color:var(--midnight)}

  /* ---------- Layout ---------- */
  .app{min-height:100vh;display:flex;flex-direction:column}
  .container{max-width:1280px;margin:0 auto;padding:0 32px;width:100%}

  /* ---------- Top Nav ---------- */
  .nav{
    position:sticky;top:0;z-index:50;
    background:rgba(11,20,38,0.85);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:78px}
  .brand{display:flex;align-items:center;gap:14px;cursor:pointer}
  .brand-mark{
    width:42px;height:42px;border:1px solid var(--gold);
    display:grid;place-items:center;
    font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--gold);
    letter-spacing:1px;
  }
  .brand-name{font-family:'Cormorant Garamond',serif;font-size:22px;letter-spacing:3px;color:var(--ivory)}
  .brand-name span{color:var(--gold)}
  .brand-sub{font-size:10px;letter-spacing:4px;color:var(--muted);text-transform:uppercase;margin-top:-2px}
  .nav-links{display:flex;gap:36px;align-items:center}
  .nav-links a{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--ivory);opacity:.75;transition:opacity .2s,color .2s;position:relative}
  .nav-links a:hover{opacity:1;color:var(--gold)}
  .nav-cta{display:flex;gap:14px;align-items:center}
  .btn{
    padding:11px 22px;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;
    border:1px solid var(--gold);color:var(--gold);
    transition:all .25s ease;display:inline-flex;align-items:center;gap:8px;
  }
  .btn:hover{background:var(--gold);color:var(--midnight)}
  .btn-primary{background:var(--gold);color:var(--midnight)}
  .btn-primary:hover{background:var(--gold-soft);border-color:var(--gold-soft)}
  .btn-ghost{border-color:var(--line)}
  .btn-ghost:hover{border-color:var(--gold);background:transparent;color:var(--gold)}
  .btn-danger{border-color:var(--red);color:var(--red)}
  .btn-danger:hover{background:var(--red);color:#fff}
  .btn-sm{padding:7px 14px;font-size:10px;letter-spacing:2px}
  .btn-block{width:100%;justify-content:center}

  /* ---------- Hero ---------- */
  .hero{
    position:relative;min-height:calc(100vh - 78px);
    display:flex;align-items:center;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(198,166,107,0.08), transparent 50%),
      radial-gradient(ellipse at 80% 70%, rgba(16,29,50,0.9), transparent 60%),
      linear-gradient(180deg, var(--midnight), var(--charcoal));
    overflow:hidden;
  }
  .hero::before{
    content:"";position:absolute;inset:0;
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size:80px 80px;
    mask-image:radial-gradient(ellipse at center, black 20%, transparent 70%);
    opacity:.5;
  }
  .hero-content{position:relative;z-index:2;max-width:820px}
  .eyebrow{
    display:inline-flex;align-items:center;gap:12px;
    font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);
    margin-bottom:28px;
  }
  .eyebrow::before{content:"";width:40px;height:1px;background:var(--gold)}
  .hero h1{
    font-size:clamp(42px,6vw,82px);line-height:1.05;color:var(--ivory);
    margin-bottom:28px;letter-spacing:-.5px;
  }
  .hero h1 em{color:var(--gold);font-style:italic;font-weight:400}
  .hero p{font-size:17px;color:var(--muted);max-width:560px;margin-bottom:40px;line-height:1.7}
  .hero-actions{display:flex;gap:16px;flex-wrap:wrap}
  .hero-stats{
    display:grid;grid-template-columns:repeat(4,1fr);gap:0;
    margin-top:90px;border-top:1px solid var(--line);padding-top:36px;
  }
  .stat .n{font-family:'Cormorant Garamond',serif;font-size:34px;color:var(--gold);letter-spacing:.5px}
  .stat .l{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-top:6px}

  /* ---------- Sections ---------- */
  section.block{padding:110px 0;border-top:1px solid var(--line)}
  .sec-head{text-align:center;max-width:640px;margin:0 auto 70px}
  .sec-head .eyebrow{justify-content:center}
  .sec-head h2{font-size:clamp(32px,4vw,52px);color:var(--ivory);margin-bottom:18px}
  .sec-head p{color:var(--muted);font-size:15px}

  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
  .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
  .grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:28px}

  .card{
    background:linear-gradient(180deg, rgba(23,25,29,0.6), rgba(16,29,50,0.4));
    border:1px solid var(--line);
    padding:36px 32px;
    transition:all .35s ease;
    position:relative;
  }
  .card:hover{border-color:var(--gold);transform:translateY(-4px)}
  .card .icon{
    width:48px;height:48px;border:1px solid var(--gold);
    display:grid;place-items:center;color:var(--gold);
    margin-bottom:24px;font-size:20px;
  }
  .card h3{font-size:24px;color:var(--ivory);margin-bottom:12px}
  .card p{color:var(--muted);font-size:14px;line-height:1.7}

  /* ---------- Markets Ticker ---------- */
  .markets{background:var(--charcoal);padding:60px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .markets-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
  .mkt{
    padding:22px;border:1px solid var(--line);
    background:rgba(11,20,38,0.4);
    display:flex;flex-direction:column;gap:6px;
  }
  .mkt .sym{font-size:11px;letter-spacing:3px;color:var(--gold);text-transform:uppercase}
  .mkt .name{font-size:12px;color:var(--muted);margin-bottom:8px}
  .mkt .price{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--ivory)}
  .mkt .chg{font-size:12px;letter-spacing:1px}
  .up{color:var(--green)}
  .down{color:var(--red)}

  /* ---------- Footer ---------- */
  footer{background:var(--charcoal);padding:70px 0 30px;border-top:1px solid var(--line)}
  .foot-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:40px;margin-bottom:50px}
  .foot-col h4{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:20px}
  .foot-col a{display:block;color:var(--muted);font-size:13px;padding:6px 0;transition:color .2s}
  .foot-col a:hover{color:var(--gold)}
  .foot-col p{color:var(--muted);font-size:13px;line-height:1.7;margin-top:14px}
  .foot-bottom{border-top:1px solid var(--line);padding-top:24px;display:flex;justify-content:space-between;color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase}

  /* ---------- Auth Pages ---------- */
  .auth-wrap{
    min-height:100vh;display:grid;grid-template-columns:1fr 1fr;
    background:var(--midnight);
  }
  .auth-art{
    position:relative;overflow:hidden;
    background:
      radial-gradient(ellipse at 30% 30%, rgba(198,166,107,0.15), transparent 60%),
      linear-gradient(135deg, var(--deep), var(--charcoal));
    display:flex;align-items:center;justify-content:center;padding:60px;
  }
  .auth-art::before{
    content:"";position:absolute;inset:0;
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size:60px 60px;
    mask-image:radial-gradient(ellipse at center, black 20%, transparent 75%);
  }
  .auth-art-inner{position:relative;z-index:2;max-width:480px;text-align:center}
  .auth-art h2{font-size:48px;color:var(--ivory);margin-bottom:20px;line-height:1.1}
  .auth-art h2 em{color:var(--gold);font-style:italic}
  .auth-art p{color:var(--muted);font-size:15px;line-height:1.7;margin-bottom:30px}
  .auth-art .sig{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold);font-size:18px;letter-spacing:1px}
  .auth-form-wrap{display:flex;align-items:center;justify-content:center;padding:60px}
  .auth-form{width:100%;max-width:420px}
  .auth-form .brand{margin-bottom:40px}
  .auth-form h1{font-size:38px;color:var(--ivory);margin-bottom:10px}
  .auth-form .sub{color:var(--muted);margin-bottom:36px;font-size:14px}
  .field{margin-bottom:20px}
  .field label{display:block;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
  .field input,.field select,.field textarea{
    width:100%;padding:14px 16px;
    background:rgba(11,20,38,0.5);
    border:1px solid var(--line);
    color:var(--ivory);
    transition:border-color .2s;
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold)}
  .field textarea{min-height:90px;resize:vertical}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .auth-foot{display:flex;justify-content:space-between;align-items:center;margin-top:24px;font-size:13px;color:var(--muted)}
  .auth-foot a{color:var(--gold)}
  .auth-foot a:hover{text-decoration:underline}
  .divider{display:flex;align-items:center;gap:14px;margin:24px 0;color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
  .notice{padding:12px 14px;font-size:12px;border:1px solid;margin-bottom:20px;letter-spacing:.5px}
  .notice.info{border-color:var(--gold);color:var(--gold);background:rgba(198,166,107,0.06)}
  .notice.err{border-color:var(--red);color:var(--red);background:rgba(217,116,116,0.06)}
  .notice.ok{border-color:var(--green);color:var(--green);background:rgba(91,185,140,0.06)}

  /* ---------- Dashboard Shell ---------- */
  .dash{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
  .sidebar{
    background:var(--charcoal);
    border-right:1px solid var(--line);
    padding:30px 0;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .side-brand{padding:0 28px 28px;border-bottom:1px solid var(--line);margin-bottom:20px}
  .side-brand .brand-name{font-size:18px;letter-spacing:2px}
  .side-brand .brand-sub{font-size:9px;letter-spacing:3px}
  .side-section{padding:0 20px;margin-bottom:24px}
  .side-section .lbl{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);padding:0 8px;margin-bottom:10px}
  .side-link{
    display:flex;align-items:center;gap:12px;
    padding:11px 14px;font-size:13px;color:var(--ivory);
    border-left:2px solid transparent;
    transition:all .2s;cursor:pointer;
  }
  .side-link:hover{background:rgba(198,166,107,0.05);color:var(--gold)}
  .side-link.active{background:rgba(198,166,107,0.08);color:var(--gold);border-left-color:var(--gold)}
  .side-link .dot{width:6px;height:6px;background:var(--gold);border-radius:50%;opacity:.5}
  .side-link.active .dot{opacity:1}

  .main{background:var(--midnight);min-width:0}
  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    padding:20px 40px;border-bottom:1px solid var(--line);
    background:rgba(11,20,38,0.6);backdrop-filter:blur(10px);
    position:sticky;top:0;z-index:20;
  }
  .topbar h1{font-size:26px;color:var(--ivory)}
  .topbar .sub{font-size:12px;color:var(--muted);letter-spacing:1px;margin-top:2px}
  .user-chip{display:flex;align-items:center;gap:14px}
  .avatar{
    width:40px;height:40px;border:1px solid var(--gold);
    display:grid;place-items:center;color:var(--gold);
    font-family:'Cormorant Garamond',serif;font-size:18px;
  }
  .user-chip .who{font-size:13px;color:var(--ivory)}
  .user-chip .role{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}

  .content{padding:40px}
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:32px;flex-wrap:wrap;gap:16px}
  .page-head h2{font-size:34px;color:var(--ivory)}
  .page-head .sub{color:var(--muted);font-size:13px;margin-top:6px}

  /* ---------- KPI cards ---------- */
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:32px}
  .kpi{
    padding:24px;background:linear-gradient(180deg, rgba(23,25,29,0.6), rgba(16,29,50,0.3));
    border:1px solid var(--line);position:relative;overflow:hidden;
  }
  .kpi::before{content:"";position:absolute;top:0;left:0;width:40px;height:1px;background:var(--gold)}
  .kpi .lbl{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
  .kpi .val{font-family:'Cormorant Garamond',serif;font-size:30px;color:var(--ivory);letter-spacing:.3px}
  .kpi .delta{font-size:11px;margin-top:8px;letter-spacing:1px}

  /* ---------- Panels ---------- */
  .panel{
    background:linear-gradient(180deg, rgba(23,25,29,0.6), rgba(16,29,50,0.3));
    border:1px solid var(--line);
    margin-bottom:24px;
  }
  .panel-head{
    padding:20px 24px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;
  }
  .panel-head h3{font-size:20px;color:var(--ivory)}
  .panel-head .hint{font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
  .panel-body{padding:24px}
  .panel-body.flush{padding:0}

  /* ---------- Tables ---------- */
  table{width:100%;border-collapse:collapse}
  th,td{padding:14px 20px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
  th{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);font-weight:500;background:rgba(11,20,38,0.4)}
  td{color:var(--ivory)}
  tr:hover td{background:rgba(198,166,107,0.03)}
  tr:last-child td{border-bottom:none}
  .pill{display:inline-block;padding:4px 10px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;border:1px solid}
  .pill.ok{color:var(--green);border-color:var(--green)}
  .pill.pending{color:var(--gold);border-color:var(--gold)}
  .pill.rejected{color:var(--red);border-color:var(--red)}
  .pill.info{color:var(--muted);border-color:var(--line)}

  /* ---------- Charts ---------- */
  .chart-wrap{position:relative;height:280px}
  .chart-wrap.tall{height:360px}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:24px}
  .tab{
    padding:14px 22px;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--muted);border-bottom:2px solid transparent;transition:all .2s;
  }
  .tab:hover{color:var(--ivory)}
  .tab.active{color:var(--gold);border-bottom-color:var(--gold)}

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(5,10,20,0.85);backdrop-filter:blur(6px);
    z-index:100;display:none;align-items:center;justify-content:center;padding:20px;
  }
  .modal-backdrop.show{display:flex}
  .modal{
    background:var(--deep);border:1px solid var(--gold);
    width:100%;max-width:560px;max-height:90vh;overflow-y:auto;
  }
  .modal-head{padding:22px 26px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .modal-head h3{font-size:22px;color:var(--ivory)}
  .modal-close{color:var(--muted);font-size:20px;width:32px;height:32px;display:grid;place-items:center}
  .modal-close:hover{color:var(--gold)}
  .modal-body{padding:26px}
  .modal-foot{padding:18px 26px;border-top:1px solid var(--line);display:flex;gap:12px;justify-content:flex-end}

  /* ---------- Deposit address box ---------- */
  .addr-box{
    background:rgba(11,20,38,0.6);border:1px dashed var(--gold);
    padding:18px;font-family:'Courier New',monospace;font-size:12px;
    word-break:break-all;color:var(--gold);margin:14px 0;
  }
  .qr-wrap{display:flex;justify-content:center;padding:20px;background:#fff;border-radius:4px;margin:14px 0;width:fit-content}

  /* ---------- Misc ---------- */
  .row{display:flex;gap:20px;flex-wrap:wrap}
  .col{flex:1;min-width:260px}
  .kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--muted)}
  .kv .v{color:var(--ivory);font-weight:500}
  .empty{padding:50px 20px;text-align:center;color:var(--muted);font-size:13px}
  .loader{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .fade-in{animation:fadeIn .4s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- Responsive ---------- */
  @media(max-width:960px){
    .nav-links{display:none}
    .hero-stats{grid-template-columns:repeat(2,1fr);gap:20px}
    .grid-3,.grid-4,.markets-grid{grid-template-columns:repeat(2,1fr)}
    .foot-grid{grid-template-columns:1fr 1fr}
    .auth-wrap{grid-template-columns:1fr}
    .auth-art{display:none}
    .dash{grid-template-columns:1fr}
    .sidebar{position:fixed;left:-280px;z-index:40;transition:left .3s;width:260px}
    .sidebar.open{left:0}
    .kpi-grid{grid-template-columns:repeat(2,1fr)}
    .content{padding:24px}
  }
  @media(max-width:560px){
    .grid-3,.grid-4,.markets-grid,.grid-2,.kpi-grid{grid-template-columns:1fr}
    .foot-grid{grid-template-columns:1fr}
    .container{padding:0 20px}
  }

  /* Mobile menu toggle */
  .menu-toggle{display:none;padding:8px;color:var(--gold);font-size:22px}
  @media(max-width:960px){.menu-toggle{display:block}}
</style>
</head>
<body>
<div id="root" class="app"></div>

<!-- Modal container -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-title">Title</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];
const fmtUSD = n => {
  if(n===undefined||n===null||isNaN(n)) n=0;
  const abs = Math.abs(n);
  if(abs>=1e9) return '$'+(n/1e9).toFixed(2)+'B';
  if(abs>=1e6) return '$'+(n/1e6).toFixed(2)+'M';
  if(abs>=1e3) return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  return '$'+n.toFixed(2);
};
const fmtNum = (n, d=4) => {
  if(n===undefined||n===null||isNaN(n)) n=0;
  return n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
};
const fmtDate = ts => new Date(ts).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});
const fmtDateTime = ts => new Date(ts).toLocaleString('en-US',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const uid = p => p+'_'+Math.random().toString(36).slice(2,10);

/* ---------- 3. MARKET DATA (CoinGecko) ---------- */
const COINGECKO_IDS = { BTC:'bitcoin', ETH:'ethereum', USDT:'tether', USDC:'usd-coin', BNB:'binancecoin', SOL:'solana' };
async function fetchPrices(){
  if(Date.now() - state.pricesAt < 60_000 && Object.keys(state.prices).length){ return state.prices; }
  try{
    const ids = Object.values(COINGECKO_IDS).join(',');
    const r = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true`);
    if(!r.ok) throw new Error('market');
    const data = await r.json();
    const out = {};
    for(const [sym,id] of Object.entries(COINGECKO_IDS)){
      if(data[id]){
        out[sym] = { price: data[id].usd, change24h: data[id].usd_24h_change || 0 };
      }
    }
    state.prices = out;
    state.pricesAt = Date.now();
    saveState();
    return out;
  }catch(e){
    // Fallback cached or approximate
    if(Object.keys(state.prices).length) return state.prices;
    const fallback = { BTC:{price:68420,change24h:1.2}, ETH:{price:3520,change24h:-0.8}, USDT:{price:1.00,change24h:0.01}, USDC:{price:1.00,change24h:0}, BNB:{price:612,change24h:0.5}, SOL:{price:178,change24h:2.1} };
    state.prices = fallback;
    state.pricesAt = Date.now();
    saveState();
    return fallback;
  }
}
function priceOf(sym){ return state.prices[sym]?.price || 0; }
function changeOf(sym){ return state.prices[sym]?.change24h || 0; }

function render(){
  const hash = location.hash || '#/';
  const root = $('#root');
  root.innerHTML = '';
  root.className = 'app';

  // Route matching
  const [pathPart] = hash.split('?');
  const handler = routes[pathPart] || routes['/404'] || routes['/'];
  handler(root);
  window.scrollTo(0,0);
}

function handleLogin(e){
  e.preventDefault();
  const email = $('#login-email').value.trim().toLowerCase();
  const pw = $('#login-password').value;
  const user = state.users.find(u=>u.email.toLowerCase()===email && u.password===pw);
  if(!user){
    $('#login-notice').innerHTML = `<div class="notice err">Invalid credentials. Please verify and try again.</div>`;
    return;
  }
  state.session = { userId:user.id, at:Date.now() };
  saveState();
  addAudit(user.email,'auth.login',user.id,'Successful login');
  saveState();
  toast('Welcome, '+user.name.split(' ')[0]+'.','ok');
  navigate(user.role==='admin' ? '#/admin' : '#/dashboard');
}

function handleSignup(e){
  e.preventDefault();
  const first = $('#su-first').value.trim();
  const last = $('#su-last').value.trim();
  const email = $('#su-email').value.trim().toLowerCase();
  const pw = $('#su-password').value;
  const confirm = $('#su-confirm').value;
  if(pw!==confirm){
    $('#signup-notice').innerHTML = `<div class="notice err">Passwords do not match.</div>`;
    return;
  }
  if(state.users.some(u=>u.email.toLowerCase()===email)){
    $('#signup-notice').innerHTML = `<div class="notice err">An account with this email already exists.</div>`;
    return;
  }
  const newUser = {
    id: uid('u'),
    email, password: pw,
    name: first+' '+last,
    role: 'investor',
    createdAt: Date.now(),
    kyc: 'pending',
    balances: { BTC:0, ETH:0, USDT:0, USDC:0, BNB:0, SOL:0 },
    depositAddresses: generateDepositAddresses()
  };
  state.users.push(newUser);
  addAudit(email,'account.created',newUser.id,'New investor account created');
  state.session = { userId:newUser.id, at:Date.now() };
  saveState();
  toast('Application received. Welcome to Goldstein.','ok');
  navigate('#/dashboard');
}

function generateDepositAddresses(){
  const out = {};
  SUPPORTED_ASSETS.forEach(a=>{
    const key = a.sym+':'+a.network;
    const rand = Array.from(crypto.getRandomValues(new Uint8Array(20))).map(b=>b.toString(16).padStart(2,'0')).join('');
    let addr;
    if(a.sym==='BTC') addr = 'bc1q'+rand.slice(0,38);
    else if(a.sym==='SOL') addr = Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(36)).join('').slice(0,44);
    else addr = '0x'+rand;
    out[key] = addr;
  });
  return out;
}

  let total=0;

  SUPPORTED_ASSETS.forEach(a=>{

    total += val;
    if(bal>0) holdings.push({...a, bal, val});
  });
  return {total, holdings};
}

function drawPortfolioChart(u){
  const {holdings} = investorBalancesUSD(u);
  // Build a synthetic 30-day history based on deposits
  const userLedger = state.ledger.filter(l=>l.userId===u.id).sort((a,b)=>a.at-b.at);
  const days=30, step=86400000;
  const now=Date.now();
  const labels=[], data=[];
  // We'll reconstruct approximate value per day by replaying ledger
  for(let i=days-1;i>=0;i--){
    const t = now - i*step;
    labels.push(new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric'}));
    // sum balances as of t
    const bals = { BTC:0, ETH:0, USDT:0, USDC:0, BNB:0, SOL:0 };
    userLedger.filter(l=>l.at<=t).forEach(l=>{
      if(l.type==='deposit'||l.type==='credit') bals[l.asset]=(bals[l.asset]||0)+l.amount;
      else bals[l.asset]=(bals[l.asset]||0)-l.amount;
    });
    let val=0;
    for(const s in bals) val += (bals[s]||0) * priceOf(s);
    data.push(val);
  }
  const ctx = document.getElementById('chart-perf');
  if(!ctx) return;
  new Chart(ctx,{
    type:'line',
    data:{ labels, datasets:[{
      label:'Portfolio Value',
      data,
      borderColor:'#C6A66B',
      backgroundColor:'rgba(198,166,107,0.12)',
      fill:true, tension:.35, pointRadius:0, borderWidth:2
    }]},
    options:{
      plugins:{ legend:{display:false} },
      scales:{
        x:{ ticks:{color:'#8a93a6',maxTicksLimit:8}, grid:{color:'rgba(246,242,234,0.05)'} },
        y:{ ticks:{color:'#8a93a6', callback:v=>'$'+v.toLocaleString()}, grid:{color:'rgba(246,242,234,0.05)'} }
      },
      maintainAspectRatio:false
    }
  });
}

function updateWithdrawAvail(){
  const u = currentUser(); if(!u) return;
  const sym = $('#wd-asset').value;
  const asset = SUPPORTED_ASSETS.find(a=>a.sym===sym);
  const netSel = $('#wd-network');
  netSel.innerHTML = `<option>${asset.network}</option>`;
  const bal = u.balances[sym]||0;
  $('#wd-avail').textContent = fmtNum(bal)+' '+sym;
}

function submitWithdrawal(e){
  e.preventDefault();
  const u = currentUser(); if(!u) return;
  const sym = $('#wd-asset').value;
  const network = $('#wd-network').value;
  const address = $('#wd-address').value.trim();
  const amount = parseFloat($('#wd-amount').value);
  const note = $('#wd-note').value.trim();

  if(!address){ $('#wd-notice').innerHTML = `<div class="notice err">Destination address is required.</div>`; return; }
  if(!(amount>0)){ $('#wd-notice').innerHTML = `<div class="notice err">Enter a valid amount.</div>`; return; }
  const bal = u.balances[sym]||0;
  if(amount>bal){ $('#wd-notice').innerHTML = `<div class="notice err">Insufficient ${sym} balance. Available: ${fmtNum(bal)}</div>`; return; }

  // duplicate check
  const recent = state.withdrawals.find(w=>w.userId===u.id && w.asset===sym && w.amount===amount && w.address===address && w.status==='pending');
  if(recent){ $('#wd-notice').innerHTML = `<div class="notice err">A pending request with these details already exists.</div>`; return; }

  // lock balance (reserve)
  u.balances[sym] = bal - amount;

  const w = { id:uid('w'), userId:u.id, asset:sym, amount, network, address, note, status:'pending', at:Date.now() };
  state.withdrawals.push(w);
  addAudit(u.email,'withdrawal.requested',u.id,`${amount} ${sym} to ${address.slice(0,14)}...`);
  saveState();
  toast('Withdrawal submitted for approval','ok');
  renderInvestorTab();
}

function drawAdminOverview(){
  const investors = state.users.filter(u=>u.role==='investor');
  const aumByAsset = SUPPORTED_ASSETS.map(a=>({
    sym:a.sym, color:a.color,
    val: investors.reduce((s,i)=>s+(i.balances[a.sym]||0)*priceOf(a.sym),0)
  })).filter(x=>x.val>0);

  const ctx1 = document.getElementById('chart-aum');
  if(ctx1){
    new Chart(ctx1,{
      type:'bar',
      data:{ labels:aumByAsset.map(x=>x.sym), datasets:[{ data:aumByAsset.map(x=>x.val), backgroundColor:aumByAsset.map(x=>x.color+'CC'), borderColor:aumByAsset.map(x=>x.color), borderWidth:1 }]},
      options:{
        plugins:{legend:{display:false}},
        scales:{
          x:{ticks:{color:'#8a93a6'},grid:{color:'rgba(246,242,234,0.05)'}},
          y:{ticks:{color:'#8a93a6',callback:v=>'$'+v.toLocaleString()},grid:{color:'rgba(246,242,234,0.05)'}}
        },
        maintainAspectRatio:false
      }
    });
  }
  // Tiers
  const tiers = { '< $10k':0, '$10k – $100k':0, '$100k – $1M':0, '> $1M':0 };
  investors.forEach(i=>{
    let v=0; SUPPORTED_ASSETS.forEach(a=>{ v+=(i.balances[a.sym]||0)*priceOf(a.sym); });
    if(v<10000) tiers['< $10k']++;
    else if(v<100000) tiers['$10k – $100k']++;
    else if(v<1000000) tiers['$100k – $1M']++;
    else tiers['> $1M']++;
  });
  const ctx2 = document.getElementById('chart-tiers');
  if(ctx2){
    new Chart(ctx2,{
      type:'doughnut',
      data:{ labels:Object.keys(tiers), datasets:[{ data:Object.values(tiers), backgroundColor:['#8a93a6','#A88A52','#C6A66B','#D9BE87'], borderColor:'#0B1426', borderWidth:2 }]},
      options:{ plugins:{legend:{position:'right',labels:{color:'#EEE8DC',font:{size:11},padding:14,boxWidth:10}}}, cutout:'60%', maintainAspectRatio:false }
    });
  }
}

function openWithdrawalReview(wid){
  const w = state.withdrawals.find(x=>x.id===wid); if(!w) return;
  const inv = state.users.find(u=>u.id===w.userId);
  const bal = inv?.balances[w.asset]||0;
  const reserved = state.withdrawals.filter(x=>x.userId===w.userId && x.asset===w.asset && x.status==='pending').reduce((s,x)=>s+x.amount,0);

  openModal('Withdrawal Review — '+w.id, `
    <div class="kv"><span class="k">Client</span><span class="v">${escapeHtml(inv?.name||'?')} · ${escapeHtml(inv?.email||'?')}</span></div>
    <div class="kv"><span class="k">Requested</span><span class="v">${fmtDateTime(w.at)}</span></div>
    <div class="kv"><span class="k">Asset / Network</span><span class="v">${w.asset} · ${w.network}</span></div>
    <div class="kv"><span class="k">Amount</span><span class="v" style="color:var(--gold)">${fmtNum(w.amount)} ${w.asset} (${fmtUSD(w.amount*priceOf(w.asset))})</span></div>
    <div class="kv"><span class="k">Destination</span><span class="v" style="font-family:'Courier New',monospace;font-size:11px;word-break:break-all">${escapeHtml(w.address)}</span></div>
    <div class="kv"><span class="k">Current Balance</span><span class="v">${fmtNum(bal)} ${w.asset}</span></div>
    <div class="kv"><span class="k">Pending Reservations</span><span class="v">${fmtNum(reserved)} ${w.asset}</span></div>
    ${w.note?`<div class="kv"><span class="k">Client Note</span><span class="v">${escapeHtml(w.note)}</span></div>`:''}
    ${w.status!=='pending'?`
      <div class="kv"><span class="k">Decision</span><span class="v"><span class="pill ${w.status==='approved'?'ok':'rejected'}">${w.status}</span></span></div>
      <div class="kv"><span class="k">Decided By</span><span class="v">${escapeHtml(w.decidedBy||'—')}</span></div>
      ${w.decidedAt?`<div class="kv"><span class="k">Decided At</span><span class="v">${fmtDateTime(w.decidedAt)}</span></div>`:''}
      ${w.rejectReason?`<div class="kv"><span class="k">Reason</span><span class="v">${escapeHtml(w.rejectReason)}</span></div>`:''}
      ${w.txHash?`<div class="kv"><span class="k">TX Hash</span><span class="v" style="font-family:'Courier New',monospace;font-size:11px;word-break:break-all">${escapeHtml(w.txHash)}</span></div>`:''}
    `:`
      <div class="field" style="margin-top:20px"><label>Rejection Reason (if rejecting)</label><textarea id="wd-rej-reason" placeholder="Optional"></textarea></div>
      <div class="field"><label>Broadcast TX Hash (on approval)</label><input type="text" id="wd-tx-hash" placeholder="0x... (optional — recorded for audit)"/></div>
    `}
  `, w.status==='pending' ? `
    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn btn-danger" onclick="decideWithdrawal('${w.id}','rejected')">Reject</button>
    <button class="btn btn-primary" onclick="decideWithdrawal('${w.id}','approved')">Approve & Broadcast</button>
  ` : `<button class="btn btn-ghost" onclick="closeModal()">Close</button>`);
}

function decideWithdrawal(wid, decision){
  const admin = currentUser(); if(!admin) return;
  const w = state.withdrawals.find(x=>x.id===wid); if(!w) return;
  if(w.status!=='pending'){ toast('Already decided','err'); return; }
  const inv = state.users.find(u=>u.id===w.userId); if(!inv){ toast('Investor not found','err'); return; }

  if(decision==='approved'){
    // Validate sufficient balance (already reserved)
    const txHash = $('#wd-tx-hash')?.value.trim() || ('0x'+Array.from(crypto.getRandomValues(new Uint8Array(32))).map(b=>b.toString(16).padStart(2,'0')).join(''));
    w.status='approved';
    w.decidedBy = admin.email;
    w.decidedAt = Date.now();
    w.txHash = txHash;
    // Record in ledger as withdrawal (permanent debit)
    state.ledger.push({
      id:uid('l'), userId:w.userId, type:'withdraw', asset:w.asset, amount:w.amount,
      reason:'Withdrawal '+w.id+' to '+w.address.slice(0,14)+'...',
      by:admin.email, at:Date.now()
    });
    addAudit(admin.email,'withdrawal.approved',w.userId,`${w.amount} ${w.asset} approved · TX ${txHash.slice(0,14)}...`);
    toast('Withdrawal approved and recorded','ok');
  } else {
    // Reject → release reserved balance back to investor
    const reason = $('#wd-rej-reason')?.value.trim() || 'Rejected by administrator';
    inv.balances[w.asset] = (inv.balances[w.asset]||0) + w.amount;
    w.status='rejected';
    w.decidedBy = admin.email;
    w.decidedAt = Date.now();
    w.rejectReason = reason;
    addAudit(admin.email,'withdrawal.rejected',w.userId,`${w.amount} ${w.asset} rejected · ${reason}`);
    toast('Withdrawal rejected, balance released','ok');
  }
  saveState();
  closeModal();
  renderAdminTab();
}

function submitAdjustment(e){
  e.preventDefault();
  const admin = currentUser(); if(!admin || admin.role!=='admin') return;
  const userId = $('#adj-user').value;
  const asset = $('#adj-asset').value;
  const direction = $('#adj-dir').value;
  const amount = parseFloat($('#adj-amount').value);
  const reason = $('#adj-reason').value.trim();

  if(!userId){ $('#adj-notice').innerHTML = `<div class="notice err">Select an investor.</div>`; return; }
  if(!(amount>0)){ $('#adj-notice').innerHTML = `<div class="notice err">Enter a valid amount.</div>`; return; }
  if(!reason){ $('#adj-notice').innerHTML = `<div class="notice err">Reason is required.</div>`; return; }

  const inv = state.users.find(u=>u.id===userId); if(!inv){ toast('Investor not found','err'); return; }
  const cur = inv.balances[asset]||0;
  if(direction==='debit' && amount>cur){
    $('#adj-notice').innerHTML = `<div class="notice err">Insufficient balance. ${inv.name} holds ${fmtNum(cur)} ${asset}.</div>`;
    return;
  }

  // Apply
  if(direction==='credit') inv.balances[asset] = cur + amount;
  else inv.balances[asset] = cur - amount;

  // Ledger entry
  state.ledger.push({
    id:uid('l'), userId, type: direction==='credit'?'credit':'debit',
    asset, amount, reason, by:admin.email, at:Date.now()
  });
  // Adjustment record
  state.adjustments.push({
    id:uid('a'), userId, asset, amount, direction, reason, by:admin.email, at:Date.now()
  });
  addAudit(admin.email,'balance.'+direction,userId,`${amount} ${asset} · ${reason}`);
  saveState();
  toast('Adjustment recorded','ok');
  closeModal();
  renderAdminTab();
}

function adminReports(){
  const investors = state.users.filter(u=>u.role==='investor');
  let totalAUM=0;
  const byAsset = {};

  investors.forEach(i=>{
    SUPPORTED_ASSETS.forEach(a=>{

    });
  });
  return `
    <div class="page-head">

    <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr)">
      <div class="kpi"><div class="lbl">Total AUM</div><div class="val">${fmtUSD(totalAUM)}</div></div>
      <div class="kpi"><div class="lbl">Clients</div><div class="val">${investors.length}</div></div>
      <div class="kpi"><div class="lbl">Ledger Entries</div><div class="val">${state.ledger.length}</div></div>
    </div>
    <div class="grid-2">

        <div class="panel-body"><div class="chart-wrap tall"><canvas id="chart-rep-aum"></canvas></div></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Aggregate Holdings</h3></div>
        <div class="panel-body flush">
          <table>
            <thead><tr><th>Asset</th><th style="text-align:right">Total Balance</th><th style="text-align:right">Market Value</th><th style="text-align:right">Share</th></tr></thead>
            <tbody>
              ${SUPPORTED_ASSETS.map(a=>{
                const b = byAsset[a.sym];
                const v = b*priceOf(a.sym);
                return `<tr>
                  <td><strong>${a.sym}</strong></td>
                  <td style="text-align:right;font-family:'Courier New',monospace">${fmtNum(b)}</td>
                  <td style="text-align:right">${fmtUSD(v)}</td>
                  <td style="text-align:right;color:var(--gold)">${totalAUM>0?(v/totalAUM*100).toFixed(1):'0.0'}%</td>
                </tr>`;
              }).join('')}
              <tr style="border-top:2px solid var(--gold)">
                <td><strong>TOTAL</strong></td>
                <td></td>
                <td style="text-align:right"><strong>${fmtUSD(totalAUM)}</strong></td>
                <td style="text-align:right;color:var(--gold)"><strong>100%</strong></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

function drawAdminReports(){
  // 30-day AUM history
  const investors = state.users.filter(u=>u.role==='investor');
  const days=30, step=86400000, now=Date.now();
  const labels=[], data=[];
  for(let i=days-1;i>=0;i--){
    const t = now - i*step;
    labels.push(new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric'}));
    let v=0;
    investors.forEach(inv=>{
      const bals = { BTC:0, ETH:0, USDT:0, USDC:0, BNB:0, SOL:0 };
      state.ledger.filter(l=>l.userId===inv.id && l.at<=t).forEach(l=>{
        if(l.type==='deposit'||l.type==='credit') bals[l.asset]+=l.amount;
        else bals[l.asset]-=l.amount;
      });
      for(const s in bals) v += bals[s]*priceOf(s);
    });
    data.push(v);
  }
  const ctx = document.getElementById('chart-rep-aum');
  if(!ctx) return;
  new Chart(ctx,{
    type:'line',
    data:{ labels, datasets:[{ label:'AUM', data, borderColor:'#C6A66B', backgroundColor:'rgba(198,166,107,0.15)', fill:true, tension:.35, pointRadius:0, borderWidth:2 }]},
    options:{
      plugins:{legend:{display:false}},
      scales:{
        x:{ticks:{color:'#8a93a6',maxTicksLimit:8},grid:{color:'rgba(246,242,234,0.05)'}},
        y:{ticks:{color:'#8a93a6',callback:v=>'$'+v.toLocaleString()},grid:{color:'rgba(246,242,234,0.05)'}}
      },
      maintainAspectRatio:false
    }
  });
}
